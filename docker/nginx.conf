server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    absolute_redirect off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}

server {
    listen       80;
    listen  [::]:80;
    server_name  sakurasi.de www.sakurasi.de;

    return 301 https://home.sakurasi.de$request_uri;
}
