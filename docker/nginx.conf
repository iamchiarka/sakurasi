map $uri $cache_control {
    ~^/_astro/  "public, max-age=31536000, immutable";
    ~^/fonts/   "public, max-age=604800";
    default     "no-cache";
}

server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    absolute_redirect off;
    server_tokens off;

    root   /usr/share/nginx/html;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The theme script is inline (it must run before first paint), hence 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        index  index.html;
    }
}

server {
    listen       80;
    listen  [::]:80;
    server_name  sakurasi.de www.sakurasi.de;

    return 301 https://home.sakurasi.de$request_uri;
}
